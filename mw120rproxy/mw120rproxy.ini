[mw120rproxy]
; MW2019 Replay 1.20.4.7623265 - Local Play custom maps.
console=1
hook_bool=1
; Native local identity setup, scoped to controller 0 and the exact Replay image.
offline_auth=1
; Native fastfile opens go to the trace log; failures also go to the main log.
fastfile_diagnostics=1
engine_diagnostics=1
; Tilde/F7: native console. F6: diagnostic custom-map browser.
developer_ui=1
; Only explicitly selected, structurally checked custom package paths are served.
custom_map_loader=1
; Optional verbose dvar trace; the normal log already records applied overrides.
hook_variant=0
hook_trigger=loadimage
; Legacy file experiments are disabled; custom_map_loader handles packages.
custom_map_file_monitor=0
custom_map_file_redirect=0
